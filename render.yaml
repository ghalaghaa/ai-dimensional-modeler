services:
  - type: web
    name: applyflow
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false # set to your Render URL, e.g. https://applyflow.onrender.com
      - key: SERVER_URL
        sync: false # same URL as CLIENT_URL — this is a single combined service
      - key: TOKEN_ENCRYPTION_KEY
        sync: false # generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false # https://<your-url>/api/auth/google/callback
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: common
      - key: MICROSOFT_REDIRECT_URI
        sync: false # https://<your-url>/api/auth/microsoft/callback
      - key: GROQ_API_KEY
        sync: false
