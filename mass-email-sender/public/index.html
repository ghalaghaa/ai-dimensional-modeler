<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إرسال إيميل لعدة مستلمين</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>إرسال إيميل جماعي</h1>
    <p class="subtitle">أضف عدة إيميلات وأرسل نفس الرسالة للجميع دفعة واحدة</p>

    <form id="send-form">
      <label for="email-input">المستلمون</label>
      <div class="chip-box" id="chip-box">
        <input id="email-input" type="text" placeholder="اكتب الإيميل واضغط Enter أو فاصلة" />
      </div>

      <label for="subject">الموضوع</label>
      <input id="subject" type="text" placeholder="موضوع الرسالة" required />

      <label for="message">الرسالة</label>
      <textarea id="message" rows="8" placeholder="اكتب رسالتك هنا..." required></textarea>

      <button type="submit" id="send-btn">إرسال</button>
    </form>

    <div id="status"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
