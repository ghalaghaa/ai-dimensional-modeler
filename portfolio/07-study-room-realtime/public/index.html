<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Room — Real-time Collaboration</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-light: #273548;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #60a5fa;
    --accent-2: #34d399;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  header h1 { font-size: 1.15rem; margin: 0; }
  header h1 span { color: var(--accent); }

  #join-form {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
  }
  input, button {
    font-size: 0.9rem;
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel-light);
    color: var(--text);
  }
  button {
    background: var(--accent);
    color: #0b1220;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #status {
    font-size: 0.8rem;
    color: var(--muted);
    padding: 0 1.5rem;
  }
  #status.connected { color: var(--accent-2); }

  main {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 1rem;
    padding: 1rem 1.5rem 1.5rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    display: flex;
    flex-direction: column;
  }
  .panel h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 0.75rem;
  }

  #notes {
    width: 100%;
    min-height: 300px;
    resize: vertical;
    background: var(--panel-light);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 0.9rem;
    line-height: 1.5;
  }

  #participants {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  #participants li {
    padding: 0.4rem 0.5rem;
    border-radius: 6px;
    background: var(--panel-light);
    margin-bottom: 0.4rem;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  #participants li::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-2);
    display: inline-block;
  }

  #chat-log {
    flex: 1;
    min-height: 220px;
    max-height: 320px;
    overflow-y: auto;
    background: var(--panel-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem;
    font-size: 0.85rem;
    margin-bottom: 0.6rem;
  }
  .chat-msg { margin-bottom: 0.5rem; }
  .chat-msg .sender { color: var(--accent); font-weight: 600; }
  .chat-msg .time { color: var(--muted); font-size: 0.7rem; margin-left: 0.35rem; }
  .chat-msg .text { display: block; }

  #chat-form { display: flex; gap: 0.5rem; }
  #chat-input { flex: 1; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Study<span>Room</span> — live collaboration</h1>
  <form id="join-form">
    <input id="name-input" type="text" placeholder="Your name" required />
    <input id="room-input" type="text" placeholder="Room code (e.g. BIO101)" required />
    <button id="join-btn" type="submit">Join room</button>
  </form>
</header>
<div id="status">Not connected</div>

<main>
  <section class="panel">
    <h2>Shared notes</h2>
    <textarea id="notes" placeholder="Notes will appear here once you join a room..." disabled></textarea>
  </section>

  <section class="panel">
    <h2>Who's here</h2>
    <ul id="participants"></ul>

    <h2 style="margin-top: 1rem;">Chat</h2>
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Say something..." disabled />
      <button id="chat-send" type="submit" disabled>Send</button>
    </form>
  </section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  const statusEl = document.getElementById('status');
  const joinForm = document.getElementById('join-form');
  const nameInput = document.getElementById('name-input');
  const roomInput = document.getElementById('room-input');
  const joinBtn = document.getElementById('join-btn');

  const notesEl = document.getElementById('notes');
  const participantsEl = document.getElementById('participants');
  const chatLog = document.getElementById('chat-log');
  const chatForm = document.getElementById('chat-form');
  const chatInput = document.getElementById('chat-input');
  const chatSend = document.getElementById('chat-send');

  let currentRoom = null;
  let applyingRemoteNote = false;

  socket.on('connect', () => {
    statusEl.textContent = 'Connected to server';
    statusEl.classList.add('connected');
  });

  socket.on('disconnect', () => {
    statusEl.textContent = 'Disconnected — trying to reconnect...';
    statusEl.classList.remove('connected');
  });

  joinForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const displayName = nameInput.value.trim();
    const roomCode = roomInput.value.trim().toUpperCase();
    if (!displayName || !roomCode) return;

    currentRoom = roomCode;
    socket.emit('join-room', { roomCode, displayName });

    notesEl.disabled = false;
    chatInput.disabled = false;
    chatSend.disabled = false;
    joinBtn.textContent = 'Joined ✓';
    joinBtn.disabled = true;
    statusEl.textContent = `Connected — in room "${roomCode}" as ${displayName}`;
  });

  // Shared notes: sent on join, then updated live.
  socket.on('note-sync', ({ content }) => {
    applyingRemoteNote = true;
    notesEl.value = content || '';
    applyingRemoteNote = false;
  });

  socket.on('note-update', ({ content }) => {
    applyingRemoteNote = true;
    notesEl.value = content || '';
    applyingRemoteNote = false;
  });

  let debounceTimer = null;
  notesEl.addEventListener('input', () => {
    if (applyingRemoteNote || !currentRoom) return;
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      socket.emit('note-update', { roomCode: currentRoom, content: notesEl.value });
    }, 150);
  });

  // Presence
  socket.on('presence-update', ({ participants }) => {
    participantsEl.innerHTML = '';
    participants.forEach((name) => {
      const li = document.createElement('li');
      li.textContent = name;
      participantsEl.appendChild(li);
    });
  });

  // Chat
  chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = chatInput.value.trim();
    if (!text || !currentRoom) return;
    socket.emit('chat-message', { roomCode: currentRoom, text });
    chatInput.value = '';
  });

  socket.on('chat-message', ({ sender, text, timestamp }) => {
    const div = document.createElement('div');
    div.className = 'chat-msg';
    const time = new Date(timestamp).toLocaleTimeString();
    div.innerHTML = `<span class="sender">${escapeHtml(sender)}</span><span class="time">${time}</span><span class="text">${escapeHtml(text)}</span>`;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
